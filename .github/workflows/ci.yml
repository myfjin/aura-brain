name: CI

# Fires on every push to main and on every PR. The gate is the same either
# way: lint, types, tests must pass across the supported Python versions,
# and PRs must carry a DCO sign-off per CONTRIBUTING.md.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # -----------------------------------------------------------------------
  # Lint + type check. Fast; runs once on the newest supported Python.
  # A failure here is a signal that the code disagrees with the tool
  # config, not that the code is wrong — read the diagnostic before "fix".
  # -----------------------------------------------------------------------
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src

      # ------------------------------------------------------------------
      # The gate that would have caught our worst packaging mistake.
      # `py_compile` resolves no names: it passes on `import os` missing, on a
      # wrong alias, on a module that only fails when called. A real import is
      # the cheapest check that actually means something.
      # ------------------------------------------------------------------
      - name: Import gate (not py_compile)
        run: |
          python -c "import aura_brain; print('aura_brain', aura_brain.__version__)"
          python -c "import aura_brain, brain_mcp; print('core loop imports')"

      # _core/ is excluded from lint/format/types BY PATH (VENDORING.md). paths.py
      # is the one core file we hand-wrote, so it is checked by name — otherwise
      # "excluded" would quietly mean "nothing in _core is checked at all".
      - name: Vendored settings module (checked by name)
        run: |
          ruff check src/aura_brain/_core/paths.py
          ruff format --check src/aura_brain/_core/paths.py
          mypy --strict src/aura_brain/_core/paths.py

  # -----------------------------------------------------------------------
  # Test matrix. PYTHONHASHSEED is set in pyproject.toml for determinism,
  # so calibration-path tests do not depend on Python's per-process hash
  # randomization (T7.13 lesson: `list(<set of str>)` was the bug).
  # -----------------------------------------------------------------------
  test:
    name: pytest (${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest with coverage
        env:
          PYTHONHASHSEED: "0"
        run: pytest --cov=aura_brain --cov-report=xml --cov-report=term-missing

      # Coverage is kept as a build artifact, not sent to a third-party
      # service: codecov needs a token this repo does not have, so the
      # previous step was a permanent no-op. An artifact always works, and
      # it is retrievable from the run page.
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          retention-days: 7

  # -----------------------------------------------------------------------
  # Privacy. This repository ships CODE and ONLY code: the corpus on which the
  # advice is based is the private part, and so is anything derived from it.
  # Embedding caches are derived data — `ds_keys_cache.npz` once shipped 374
  # vectors computed from a real registry, which is a leak, not noise. These
  # three checks are cheap and they run on every PR.
  # -----------------------------------------------------------------------
  privacy:
    name: privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No private absolute paths in shipped code
        run: |
          set -euo pipefail
          # tools/ is deliberately out of scope: revendor.py's edit table MUST quote
          # the canonical strings it rewrites, so it contains them by design. What
          # ships to a user is src/ + tests/ + docs/ — that is what this checks.
          targets=$(git ls-files 'src/**' 'tests/**' 'docs/**' '*.md' 'pyproject.toml')
          hits=$(echo "$targets" | xargs grep -nE '/home/au|/Users/s_[a-z]+|\.hermes/profiles|~/ai-lab|/ai-lab/' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a private path is in a shipped file"
            exit 1
          fi
          echo "clean: $(echo "$targets" | wc -l | tr -d ' ') files scanned"

      - name: No credentials
        run: |
          set -euo pipefail
          hits=$(git ls-files 'src/**' 'tests/**' 'docs/**' 'tools/**' '*.md' '*.toml' \
                 | xargs grep -nIE 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::possible credential in a tracked file"
            exit 1
          fi
          echo "clean"

      - name: No derived data (a cache is the corpus, re-encoded)
        run: |
          set -euo pipefail
          # Embedding caches are derived DATA: ds_keys_cache.npz once carried 374
          # vectors computed from a real registry. That is a leak, not noise.
          # The authored synthetic fixtures ARE tracked on purpose — they are named
          # synthetic_* and they are the only data allowed in. Anything else is
          # derived. (A green local run once hid this: .gitignore excluded the
          # fixtures, the tests passed on disk, and CI failed without them.)
          hits=$(git ls-files | grep -E '\.(npz|npy|jsonl|db|sqlite|sqlite3)$' \
                 | grep -vE '^tests/fixtures/synthetic_[^/]*\.(jsonl|db)$' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::derived data is tracked — embedding caches encode registry content"
            exit 1
          fi
          echo "clean"

  # -----------------------------------------------------------------------
  # DCO sign-off enforcement. See CONTRIBUTING.md — we use the sign-off
  # only; there is no CLA. Every commit in a PR must carry a
  # `Signed-off-by:` trailer matching the commit author.
  #
  # Implemented inline, with no third-party action: the one we used before
  # (tim-actions/dco@v1.1.0) declares `using: node12`, and GitHub has retired
  # that runtime, so it failed silently. Because this job is a REQUIRED check,
  # that failure blocked every pull request. This step is the same rule with no
  # runtime to retire.
  # -----------------------------------------------------------------------
  dco:
    name: DCO check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every PR commit
        run: |
          set -u
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          merge_base=$(git merge-base "$base" "$head")
          fail=0
          for sha in $(git rev-list "$merge_base..$head"); do
            name=$(git log -1 --format='%an' "$sha")
            email=$(git log -1 --format='%ae' "$sha")
            expected="Signed-off-by: ${name} <${email}>"
            # fixed-string match: the author email can contain regex metacharacters
            # (e.g. the '+' in a GitHub noreply address), so -F, not an ERE.
            if git log -1 --format='%B' "$sha" | sed 's/[[:space:]]*$//' | grep -qixF "$expected"; then
              echo "OK    $sha  ($email)"
            else
              echo "::error::commit $sha is missing '${expected}'"
              fail=1
            fi
          done
          exit $fail

  # -----------------------------------------------------------------------
  # Build check. Confirms the wheel and sdist actually assemble, so a
  # broken pyproject.toml or missing package layout is caught here and
  # not later against PyPI. Does NOT publish.
  # -----------------------------------------------------------------------
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build
        run: python -m build

      - name: List artifacts
        run: ls -la dist/

      # Print the sdist contents so "did docs/ actually ship?" is visible in
      # the run log rather than assumed from the include list.
      - name: List sdist contents
        run: tar tzf dist/*.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          retention-days: 7
