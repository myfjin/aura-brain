name: CI

# Fires on every push to main and on every PR. The gate is the same either
# way: lint, types, tests must pass across the supported Python versions,
# and PRs must carry a DCO sign-off per CONTRIBUTING.md.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # -----------------------------------------------------------------------
  # Lint + type check. Fast; runs once on the newest supported Python.
  # A failure here is a signal that the code disagrees with the tool
  # config, not that the code is wrong — read the diagnostic before "fix".
  # -----------------------------------------------------------------------
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src

  # -----------------------------------------------------------------------
  # Test matrix. PYTHONHASHSEED is set in pyproject.toml for determinism,
  # so calibration-path tests do not depend on Python's per-process hash
  # randomization (T7.13 lesson: `list(<set of str>)` was the bug).
  # -----------------------------------------------------------------------
  test:
    name: pytest (${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest --cov=aura_brain --cov-report=xml --cov-report=term-missing

      # Coverage upload is opt-in — enable when a codecov token is added
      # to the repo secrets. Until then this step no-ops to keep the CI
      # green for external forks that cannot access the secret.
      - name: Upload coverage
        if: matrix.python-version == '3.13' && github.event_name == 'push'
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # -----------------------------------------------------------------------
  # DCO sign-off enforcement. See CONTRIBUTING.md — we use the sign-off
  # only; there is no CLA. Every commit in a PR must carry a
  # `Signed-off-by:` trailer matching the commit author.
  # -----------------------------------------------------------------------
  dco:
    name: DCO check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check sign-off
        uses: tim-actions/dco@v1.1.0
        with:
          commits: ${{ github.event.pull_request.commits }}

  # -----------------------------------------------------------------------
  # Build check. Confirms the wheel and sdist actually assemble, so a
  # broken pyproject.toml or missing package layout is caught here and
  # not later against PyPI. Does NOT publish.
  # -----------------------------------------------------------------------
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build
        run: python -m build

      - name: List artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          retention-days: 7
